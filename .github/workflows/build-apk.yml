name: Build PULSE APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -q -o PULSE-Phase1.zip
      - name: Apply Phase 2 voice sources
        run: |
          cp phase2/MainActivity.kt PULSE-Phase1/app/src/main/java/com/pulse/assistant/MainActivity.kt
          cp phase2/VoiceSession.kt PULSE-Phase1/app/src/main/java/com/pulse/assistant/VoiceSession.kt
          cp phase2/AndroidManifest.xml PULSE-Phase1/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: PULSE-Phase1
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-Phase1-APK
          path: PULSE-Phase1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
